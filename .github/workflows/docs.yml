name: docs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Local links and heading anchors only; remote links would make the gate flaky.
          args: --offline --include-fragments --no-progress '*.md' 'docs/**/*.md'
          fail: true
